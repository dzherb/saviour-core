# see: https://docs.sqlc.dev/en/latest/reference/config.html#go
version: "2"
sql:
  - engine: "sqlite"
    queries: "./sql"
    schema: "../../../infra/sqlite/migrations"
    gen:
      go:
        package: "sqlitequery"
        out: "./gen"
        initialisms:
          - uuid
          - ip
        overrides:
          - db_type: "UUID_BLOB"
            go_type:
              import: "saviour/internal/repository/sqlite/sqlc"
              type: "UUID"
          - db_type: "UNIXTIME_INT"
            go_type:
              import: "saviour/internal/repository/sqlite/sqlc"
              type: "UnixTime"
          - db_type: "UNIXTIME_INT"
            nullable: true
            go_type:
              import: "saviour/internal/repository/sqlite/sqlc"
              type: "UnixTime"
          - db_type: "BOOLEAN"
            go_type:
              type: "bool"
          - db_type: "IP_BLOB"
            go_type:
              import: "saviour/internal/repository/sqlite/sqlc"
              type: "IP"